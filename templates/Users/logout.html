{% extends 'base.html' %}

{% block title %}Logged Out - Face Recognition Attendance System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-0">
            <div class="card-body p-5 text-center">
                <i class="fas fa-sign-out-alt fa-4x text-primary mb-4"></i>
                <h3 class="fw-bold mb-3">Logged Out Successfully</h3>
                <p class="text-muted mb-4">You have been successfully logged out of your account.</p>
                
                <div class="d-grid gap-2">
                    <a href="{% url 'login' %}" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt me-2"></i>Login Again
                    </a>
                    <a href="{% url 'home' %}" class="btn btn-outline-primary">
                        <i class="fas fa-home me-2"></i>Return to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
